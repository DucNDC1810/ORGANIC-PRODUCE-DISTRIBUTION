name: CI

on:
  push:
    branches: ["Develop"]
  pull_request:
    branches: ["Develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build (Vite)
        run: npm run build
